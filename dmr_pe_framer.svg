<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>Inside the burst framer</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="640" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Step ⑤ — the burst framer, one decision at a time</text><rect x="20" y="60" width="185" height="90" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="112.5" y="88.0" font-size="13" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">1  Find candidates</text><text x="112.5" y="106.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">|rho| ≥ 0.8 and the highest</text><text x="112.5" y="123.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">point in its neighbourhood</text><rect x="223" y="60" width="185" height="90" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="315.5" y="88.0" font-size="13" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">2  Pin down the peak</text><text x="315.5" y="106.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">parabola through 3 points</text><text x="315.5" y="123.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">→ timing finer than a sample</text><path d="M205 105 L223 105" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="426" y="60" width="185" height="90" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="518.5" y="88.0" font-size="13" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">3  Check the rhythm</text><text x="518.5" y="106.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">is it a whole number of</text><text x="518.5" y="123.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms from the last sync?</text><path d="M408 105 L426 105" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="629" y="60" width="185" height="90" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="721.5" y="88.0" font-size="13" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">4  Measure the burst</text><text x="721.5" y="106.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">fit level and offset from</text><text x="721.5" y="123.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">the 24 known sync symbols</text><path d="M611 105 L629 105" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="832" y="60" width="185" height="90" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="924.5" y="88.0" font-size="13" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">5  Cut it out</text><text x="924.5" y="106.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">read 144 symbols at the</text><text x="924.5" y="123.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">measured timing, normalise</text><path d="M814 105 L832 105" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="1035" y="60" width="185" height="90" rx="5" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="1127.5" y="88.0" font-size="13" fill="#501313" font-weight="600" text-anchor="middle" dominant-baseline="central">6  Send it on</text><text x="1127.5" y="106.0" font-size="12" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">message “burst” to Layer 2</text><text x="1127.5" y="123.0" font-size="12" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">+ “cach”, “progress”</text><path d="M1017 105 L1035 105" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="20" y="175" width="600" height="220" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="191.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Step 3: the 30 ms rhythm rejects fake syncs</text><line x1="50.0" y1="230.0" x2="50.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="50.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">0</text><line x1="112.0" y1="230.0" x2="112.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="112.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">30</text><line x1="174.0" y1="230.0" x2="174.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="174.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">60</text><line x1="236.0" y1="230.0" x2="236.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="236.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">90</text><line x1="298.0" y1="230.0" x2="298.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="298.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">120</text><line x1="360.0" y1="230.0" x2="360.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="360.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">150</text><line x1="422.0" y1="230.0" x2="422.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="422.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">180</text><line x1="484.0" y1="230.0" x2="484.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="484.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">210</text><line x1="546.0" y1="230.0" x2="546.0" y2="330.0" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><text x="546.0" y="345.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">240</text><text x="330.0" y="365.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">ms after the first accepted sync</text><line x1="50.0" y1="320.0" x2="50.0" y2="245.0" stroke="#0F6E56" stroke-width="3"/><line x1="112.0" y1="320.0" x2="112.0" y2="245.0" stroke="#0F6E56" stroke-width="3"/><line x1="236.0" y1="320.0" x2="236.0" y2="245.0" stroke="#0F6E56" stroke-width="3"/><line x1="298.0" y1="320.0" x2="298.0" y2="245.0" stroke="#0F6E56" stroke-width="3"/><line x1="484.0" y1="320.0" x2="484.0" y2="245.0" stroke="#0F6E56" stroke-width="3"/><line x1="384.8" y1="320.0" x2="384.8" y2="255.0" stroke="#A32D2D" stroke-width="3"/><text x="390.8" y="250.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">✗ off the grid</text><text x="118.0" y="240.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">✓</text><text x="320.0" y="385.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Voice data occasionally looks like a sync. A real one always lands on the grid.</text><rect x="640" y="175" width="580" height="220" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="654.0" y="191.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Step 4: the sync word as a measuring stick</text><line x1="670.0" y1="285.0" x2="1190.0" y2="285.0" stroke="#D3D1C7" stroke-width="1"/><line x1="670.0" y1="273.0" x2="1190.0" y2="273.0" stroke="#A32D2D" stroke-width="1" stroke-dasharray="5 4"/><circle cx="685.0" cy="230.5" r="4" fill="#185FA5"/><circle cx="705.0" cy="308.6" r="4" fill="#185FA5"/><circle cx="725.0" cy="236.0" r="4" fill="#185FA5"/><circle cx="745.0" cy="227.1" r="4" fill="#185FA5"/><circle cx="765.0" cy="311.6" r="4" fill="#185FA5"/><circle cx="785.0" cy="227.2" r="4" fill="#185FA5"/><circle cx="805.0" cy="315.3" r="4" fill="#185FA5"/><circle cx="825.0" cy="312.6" r="4" fill="#185FA5"/><circle cx="845.0" cy="238.1" r="4" fill="#185FA5"/><circle cx="865.0" cy="232.5" r="4" fill="#185FA5"/><circle cx="885.0" cy="235.2" r="4" fill="#185FA5"/><circle cx="905.0" cy="311.1" r="4" fill="#185FA5"/><circle cx="925.0" cy="231.8" r="4" fill="#185FA5"/><circle cx="945.0" cy="312.4" r="4" fill="#185FA5"/><circle cx="965.0" cy="230.2" r="4" fill="#185FA5"/><circle cx="985.0" cy="232.9" r="4" fill="#185FA5"/><circle cx="1005.0" cy="314.1" r="4" fill="#185FA5"/><circle cx="1025.0" cy="312.2" r="4" fill="#185FA5"/><circle cx="1045.0" cy="232.8" r="4" fill="#185FA5"/><circle cx="1065.0" cy="240.6" r="4" fill="#185FA5"/><circle cx="1085.0" cy="234.2" r="4" fill="#185FA5"/><circle cx="1105.0" cy="310.2" r="4" fill="#185FA5"/><circle cx="1125.0" cy="234.5" r="4" fill="#185FA5"/><circle cx="1145.0" cy="232.4" r="4" fill="#185FA5"/><text x="1185.0" y="263.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="end" dominant-baseline="central">offset</text><text x="930.0" y="360.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">We know each of these should be +3 or −3. A straight-line fit gives the gain</text><text x="930.0" y="378.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">(→ deviation in Hz) and the offset (→ tuning error in Hz) of this one burst.</text><rect x="20" y="410" width="1200" height="210" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="426.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">What the framer sends, and when</text><text x="45.0" y="445.0" font-size="12" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">burst</text><text x="165.0" y="445.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">once per burst (30 ms)</text><text x="420.0" y="445.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">144 symbols, scaled to ±1/±3, plus: where, which sync, gain, offset, voice burst letter</text><text x="45.0" y="479.0" font-size="12" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">cach</text><text x="165.0" y="479.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">every 30 ms, even without a sync</text><text x="420.0" y="479.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">12 symbols of CACH — the “who owns the next slot” header</text><text x="45.0" y="513.0" font-size="12" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">progress</text><text x="165.0" y="513.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">after each chunk of samples</text><text x="420.0" y="513.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">“every burst up to sample position p has now been sent” (for the vocoder)</text><text x="45.0" y="547.0" font-size="12" fill="#3d3d3a" font-weight="700" text-anchor="start" dominant-baseline="central">symbols</text><text x="165.0" y="547.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">continuous stream, 8 kHz</text><text x="420.0" y="547.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">the reading at each symbol centre → histogram, and the vocoder’s clock</text><text x="45.0" y="581.0" font-size="12" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">reset / tick</text><text x="165.0" y="581.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">on retune / every 10 s</text><text x="420.0" y="581.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">forget everything / time for the status panel</text></svg>