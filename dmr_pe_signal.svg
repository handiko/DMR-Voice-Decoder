<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>What a DMR repeater transmits</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="600" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">What arrives: four tones, two time slots, one sync word per burst</text><rect x="20" y="44" width="380" height="536" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">4FSK: every symbol = 2 bits</text><rect x="60.0" y="90.0" width="120.0" height="40.0" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="120.0" y="110.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">+1944 Hz</text><text x="215.0" y="110.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">bits 01</text><text x="300.0" y="110.0" font-size="12" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">level +3</text><rect x="60.0" y="160.0" width="120.0" height="40.0" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="120.0" y="180.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">+648 Hz</text><text x="215.0" y="180.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">bits 00</text><text x="300.0" y="180.0" font-size="12" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">level +1</text><rect x="60.0" y="230.0" width="120.0" height="40.0" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="120.0" y="250.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">-648 Hz</text><text x="215.0" y="250.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">bits 10</text><text x="300.0" y="250.0" font-size="12" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">level −1</text><rect x="60.0" y="300.0" width="120.0" height="40.0" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="120.0" y="320.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">-1944 Hz</text><text x="215.0" y="320.0" font-size="12" fill="#3d3d3a" font-weight="400" text-anchor="start" dominant-baseline="central">bits 11</text><text x="300.0" y="320.0" font-size="12" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">level −3</text><text x="40.0" y="410.0" font-size="12" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">4,800 symbols per second = 9,600 bits/s</text><text x="40.0" y="432.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">The carrier simply sits on one of four</text><text x="40.0" y="450.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">frequencies for 208 µs, then moves.</text><text x="40.0" y="478.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">The transmitter rounds the jumps (RRC</text><text x="40.0" y="496.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">filter, roll-off 0.2) to keep it narrow.</text><text x="40.0" y="524.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Sync symbols use only ±3: the loudest,</text><text x="40.0" y="542.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">easiest-to-recognise levels.</text><rect x="420" y="44" width="800" height="200" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="434.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Time: two slots take turns, 30 ms each</text><rect x="450.0" y="95.0" width="116.0" height="50.0" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="508.0" y="112.0" font-size="12" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot 1</text><text x="508.0" y="130.0" font-size="11" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms</text><rect x="570.0" y="95.0" width="116.0" height="50.0" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="628.0" y="112.0" font-size="12" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot 2</text><text x="628.0" y="130.0" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms</text><rect x="690.0" y="95.0" width="116.0" height="50.0" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="748.0" y="112.0" font-size="12" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot 1</text><text x="748.0" y="130.0" font-size="11" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms</text><rect x="810.0" y="95.0" width="116.0" height="50.0" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="868.0" y="112.0" font-size="12" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot 2</text><text x="868.0" y="130.0" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms</text><rect x="930.0" y="95.0" width="116.0" height="50.0" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="988.0" y="112.0" font-size="12" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot 1</text><text x="988.0" y="130.0" font-size="11" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms</text><rect x="1050.0" y="95.0" width="116.0" height="50.0" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="1108.0" y="112.0" font-size="12" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot 2</text><text x="1108.0" y="130.0" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms</text><text x="1188.0" y="120.0" font-size="18" fill="#3d3d3a" font-weight="700" text-anchor="middle" dominant-baseline="central">…</text><text x="450.0" y="175.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">A repeater transmits continuously; slot 1 and slot 2 alternate. Each slot is a separate</text><text x="450.0" y="195.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">conversation. A mobile only transmits in its own slot, so it is on air 50 % of the time.</text><text x="450.0" y="222.0" font-size="12" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">Every 30 ms = 144 symbols = one burst.</text><rect x="420" y="260" width="800" height="320" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="434.0" y="276.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">One 30 ms burst, symbol by symbol (144 symbols)</text><rect x="445.0" y="310.0" width="62.4" height="60.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="476.2" y="330.0" font-size="12" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">CACH</text><text x="476.2" y="348.0" font-size="11" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">12 symbols</text><text x="476.2" y="390.0" font-size="11" fill="#3d3d3a" font-weight="400" text-anchor="middle" dominant-baseline="central">who owns the</text><text x="476.2" y="406.0" font-size="11" fill="#3d3d3a" font-weight="400" text-anchor="middle" dominant-baseline="central">next slot</text><rect x="507.4" y="310.0" width="280.8" height="60.0" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="647.8" y="330.0" font-size="12" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">Payload, first half</text><text x="647.8" y="348.0" font-size="11" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">54 symbols</text><text x="647.8" y="390.0" font-size="11" fill="#3d3d3a" font-weight="400" text-anchor="middle" dominant-baseline="central">108 bits</text><rect x="788.2" y="310.0" width="124.8" height="60.0" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="850.6" y="330.0" font-size="12" fill="#501313" font-weight="600" text-anchor="middle" dominant-baseline="central">SYNC</text><text x="850.6" y="348.0" font-size="11" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">24 symbols</text><text x="850.6" y="390.0" font-size="11" fill="#3d3d3a" font-weight="400" text-anchor="middle" dominant-baseline="central">48 bits</text><text x="850.6" y="406.0" font-size="11" fill="#3d3d3a" font-weight="400" text-anchor="middle" dominant-baseline="central">or EMB</text><rect x="913.0" y="310.0" width="280.8" height="60.0" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="1053.4" y="330.0" font-size="12" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">Payload, second half</text><text x="1053.4" y="348.0" font-size="11" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">54 symbols</text><text x="1053.4" y="390.0" font-size="11" fill="#3d3d3a" font-weight="400" text-anchor="middle" dominant-baseline="central">108 bits</text><text x="445.0" y="445.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">The sync word sits in the middle so that both halves are equally close to it — the receiver</text><text x="445.0" y="465.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">measures timing there and the error grows less towards either end.</text><text x="445.0" y="495.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Voice bursts: only burst A of each 360 ms superframe has a sync; bursts B–F carry a</text><text x="445.0" y="515.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">small “EMB” field in that place instead, so the receiver must find them by timing.</text><text x="445.0" y="545.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Data/control bursts: payload = 196 bits of coded data + 20 bits of “slot type”.</text></svg>