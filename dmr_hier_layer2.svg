<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>Layer 2 decoder: what happens to each message</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="600" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Stage 3 — Layer 2 decoder: what happens to each message</text><rect x="20" y="250" width="200" height="90" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="120.0" y="278.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">Normalised symbols</text><text x="120.0" y="296.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">→ soft bits (LLR)</text><text x="120.0" y="313.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">sign = bit, size = confidence</text><rect x="260" y="44" width="960" height="150" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="274.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">CACH (12 symbols, every 30 ms)</text><rect x="290" y="74" width="220" height="90" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="400.0" y="102.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">TACT</text><text x="400.0" y="120.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">Hamming (7,4)</text><text x="400.0" y="137.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">→ time slot 1 / 2</text><rect x="550" y="74" width="300" height="90" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="700.0" y="102.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">Short LC</text><text x="700.0" y="120.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">4 CACH fragments, Hamming (17,12)</text><text x="700.0" y="137.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">+ column parity, CRC-8</text><rect x="890" y="74" width="300" height="90" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="1040.0" y="102.0" font-size="14" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">System identity</text><text x="1040.0" y="120.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">“SLC Tier III control ch …”</text><text x="1040.0" y="137.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">Connect Plus / Capacity Plus</text><path d="M510 119 L550 119" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850 119 L890 119" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="260" y="214" width="960" height="200" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="274.0" y="230.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Data / control burst (with sync)</text><rect x="290" y="244" width="220" height="90" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="400.0" y="272.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot type</text><text x="400.0" y="290.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">Golay (20,8)</text><text x="400.0" y="307.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">→ colour code + data type</text><rect x="550" y="244" width="300" height="90" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="700.0" y="272.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">BPTC (196,96)</text><text x="700.0" y="290.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">soft turbo decode</text><text x="700.0" y="307.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">→ 12 bytes</text><rect x="890" y="234" width="300" height="60" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="1040.0" y="255.5" font-size="14" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">CRC-CCITT (masked per type)</text><text x="1040.0" y="273.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">CSBK · MBC · data header · PI header</text><rect x="890" y="314" width="300" height="60" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="1040.0" y="335.5" font-size="14" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">RS (12,9)</text><text x="1040.0" y="353.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">voice LC header · terminator</text><path d="M510 289 L550 289" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850 279 L890 264" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850 299 L890 344" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="260" y="434" width="960" height="150" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="274.0" y="450.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Voice burst (A with sync, B…F without)</text><rect x="290" y="464" width="220" height="90" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="400.0" y="492.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">216 payload bits</text><text x="400.0" y="510.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">sync / EMB removed</text><text x="400.0" y="527.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">= 3 AMBE+2 frames</text><rect x="550" y="464" width="300" height="90" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="700.0" y="492.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">B…F: EMB + embedded LC</text><text x="700.0" y="510.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">QR (16,7) · 4 fragments</text><text x="700.0" y="527.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">→ talkgroup / source (late entry)</text><rect x="890" y="464" width="300" height="90" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="1040.0" y="492.0" font-size="14" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">“voice” message</text><text x="1040.0" y="510.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">slot · position · encrypted flag</text><text x="1040.0" y="527.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">→ vocoder</text><path d="M510 509 L550 509" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M400 554 L400 572 L1040 572 L1040 554" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><path d="M220 295 L240 295 L240 119 L290 119" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M220 295 L240 295 L240 289 L290 289" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M220 295 L240 295 L240 509 L290 509" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/></svg>