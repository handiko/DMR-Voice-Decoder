<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>AMBE+2 vocoder: placement on the signal timeline and progress gating</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="470" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Stage 4 — the vocoder places audio on the signal’s own timeline</text><text x="20.0" y="90.0" font-size="12" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">signal</text><line x1="80" y1="110" x2="1210" y2="110" stroke="#B4B2A9"/><rect x="80" y="80" width="52" height="50" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="106.0" y="105.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">A</text><rect x="137" y="80" width="52" height="50" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="163.0" y="105.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">TS1</text><rect x="194" y="80" width="52" height="50" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="220.0" y="105.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">B</text><rect x="251" y="80" width="52" height="50" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="277.0" y="105.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">TS1</text><rect x="308" y="80" width="52" height="50" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="334.0" y="105.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">C</text><rect x="365" y="80" width="52" height="50" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="391.0" y="105.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">TS1</text><rect x="422" y="80" width="52" height="50" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="448.0" y="105.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">D</text><rect x="479" y="80" width="52" height="50" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="505.0" y="105.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">TS1</text><rect x="536" y="80" width="52" height="50" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="562.0" y="105.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">E</text><rect x="593" y="80" width="52" height="50" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="619.0" y="105.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">TS1</text><rect x="650" y="80" width="52" height="50" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="676.0" y="105.0" font-size="13" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">F</text><rect x="707" y="80" width="52" height="50" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="733.0" y="105.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">TS1</text><text x="80.0" y="145.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">voice bursts of one slot, 60 ms apart (the other slot in between)</text><text x="20.0" y="230.0" font-size="12" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">audio</text><line x1="80" y1="250" x2="1210" y2="250" stroke="#B4B2A9"/><rect x="308" y="220" width="114" height="50" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="365.0" y="245.0" font-size="12" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">60 ms from A</text><rect x="422" y="220" width="114" height="50" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="479.0" y="245.0" font-size="12" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">60 ms from B</text><rect x="536" y="220" width="114" height="50" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="593.0" y="245.0" font-size="12" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">60 ms from C</text><rect x="650" y="220" width="114" height="50" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="707.0" y="245.0" font-size="12" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">60 ms from D</text><path d="M106 130 L315 220" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><path d="M220 130 L429 220" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="507.5" y="178.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">placed audio_delay later (0.4 s in the block; shortened here)</text><line x1="479.0" y1="70" x2="479.0" y2="300" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="3 3"/><text x="485.0" y="66.0" font-size="11" fill="#854F0B" font-weight="600" text-anchor="start" dominant-baseline="central">last “progress” mark</text><line x1="707.0" y1="200" x2="707.0" y2="300" stroke="#854F0B" stroke-width="2"/><text x="713.0" y="292.0" font-size="11" fill="#854F0B" font-weight="600" text-anchor="start" dominant-baseline="central">released up to here</text><rect x="707.0" y="214" width="503.0" height="62" fill="#F4F4F2" opacity="0.75"/><text x="787.0" y="245.0" font-size="12" fill="#888780" font-weight="600" text-anchor="start" dominant-baseline="central">held back until the next mark</text><rect x="20" y="330" width="590" height="120" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="315.0" y="364.5" font-size="14" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">Placement</text><text x="315.0" y="382.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">burst at sample position p → output sample (p + delay) / 6</text><text x="315.0" y="399.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">6 input samples (48 kS/s) = 1 audio sample (8 kHz)</text><text x="315.0" y="416.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">pauses stay pauses, a lost burst is a 60 ms gap, no drift</text><rect x="630" y="330" width="590" height="120" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="925.0" y="364.5" font-size="14" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">Gating</text><text x="925.0" y="382.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">the stages run in separate threads: a message can lag the clock</text><text x="925.0" y="399.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">audio sample i is released only when every burst that could still</text><text x="925.0" y="416.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">land on it has arrived (framer “progress” → Layer 2 → vocoder)</text></svg>