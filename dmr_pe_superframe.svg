<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>Voice superframe: finding bursts that have no sync</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="420" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Step ⑤ continued — a voice superframe on slot 1 (360 ms, 18 voice frames, 6 bursts)</text><rect x="30.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="73.0" y="102.0" font-size="13" fill="#501313" font-weight="700" text-anchor="middle" dominant-baseline="central">burst A</text><text x="73.0" y="124.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="middle" dominant-baseline="central">SYNC</text><text x="73.0" y="140.0" font-size="10" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">3 voice frames</text><text x="30.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">0</text><rect x="120.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="163.0" y="115.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">slot 2</text><text x="120.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">30</text><rect x="210.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="253.0" y="102.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">burst B</text><text x="253.0" y="124.0" font-size="11" fill="#0F6E56" font-weight="600" text-anchor="middle" dominant-baseline="central">EMB</text><text x="253.0" y="140.0" font-size="10" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">3 voice frames</text><text x="210.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">60</text><rect x="300.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="343.0" y="115.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">slot 2</text><text x="300.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">90</text><rect x="390.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="433.0" y="102.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">burst C</text><text x="433.0" y="124.0" font-size="11" fill="#0F6E56" font-weight="600" text-anchor="middle" dominant-baseline="central">EMB</text><text x="433.0" y="140.0" font-size="10" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">3 voice frames</text><text x="390.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">120</text><rect x="480.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="523.0" y="115.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">slot 2</text><text x="480.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">150</text><rect x="570.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="613.0" y="102.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">burst D</text><text x="613.0" y="124.0" font-size="11" fill="#0F6E56" font-weight="600" text-anchor="middle" dominant-baseline="central">EMB</text><text x="613.0" y="140.0" font-size="10" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">3 voice frames</text><text x="570.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">180</text><rect x="660.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="703.0" y="115.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">slot 2</text><text x="660.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">210</text><rect x="750.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="793.0" y="102.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">burst E</text><text x="793.0" y="124.0" font-size="11" fill="#0F6E56" font-weight="600" text-anchor="middle" dominant-baseline="central">EMB</text><text x="793.0" y="140.0" font-size="10" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">3 voice frames</text><text x="750.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">240</text><rect x="840.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="883.0" y="115.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">slot 2</text><text x="840.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">270</text><rect x="930.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="973.0" y="102.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">burst F</text><text x="973.0" y="124.0" font-size="11" fill="#0F6E56" font-weight="600" text-anchor="middle" dominant-baseline="central">EMB</text><text x="973.0" y="140.0" font-size="10" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">3 voice frames</text><text x="930.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">300</text><rect x="1020.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="1063.0" y="115.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">slot 2</text><text x="1020.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">330</text><rect x="1110.0" y="80.0" width="86.0" height="70.0" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="1153.0" y="102.0" font-size="13" fill="#501313" font-weight="700" text-anchor="middle" dominant-baseline="central">burst A</text><text x="1153.0" y="124.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="middle" dominant-baseline="central">SYNC</text><text x="1153.0" y="140.0" font-size="10" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">3 voice frames</text><text x="1110.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">360</text><text x="1180.0" y="165.0" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">ms</text><path d="M77 190 L77 155" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ahm)"/><text x="85.0" y="200.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">found by the sync detector</text><path d="M257 225 L257 155" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#ah)"/><path d="M437 225 L437 155" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#ah)"/><path d="M617 225 L617 155" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#ah)"/><path d="M797 225 L797 155" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#ah)"/><path d="M977 225 L977 155" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#ah)"/><text x="230.0" y="240.0" font-size="11" fill="#0F6E56" font-weight="600" text-anchor="start" dominant-baseline="central">cut out “blind”: exactly 60, 120, 180, 240, 300 ms after A — no detection needed</text><path d="M1157 280 L1157 155" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ahm)"/><text x="1150.0" y="295.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="end" dominant-baseline="central">next A expected</text><text x="1150.0" y="312.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="end" dominant-baseline="central">here; accepted at</text><text x="1150.0" y="329.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="end" dominant-baseline="central">rho ≥ 0.5 if missed</text><text x="30.0" y="350.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Why this works: the timing measured on burst A is good to a small fraction of a symbol, and the transmitter’s clock is stable,</text><text x="30.0" y="370.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">so 300 ms later we are still on the symbol centres. Each burst’s level and offset are re-measured from its own decided symbols.</text><text x="30.0" y="394.0" font-size="12" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">If A is lost entirely, the whole superframe (6 bursts, 360 ms of speech) waits for the next A — you hear a gap, never garbage.</text></svg>