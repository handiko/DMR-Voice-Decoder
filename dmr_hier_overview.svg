<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>DMR Decoder hier block: the big picture</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="760" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">DMR Decoder (hier) — what is inside</text><path d="M760 22 L800 22" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="808.0" y="22.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">stream (every sample)</text><path d="M970 22 L1010 22" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="1018.0" y="22.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">message (once per burst / event)</text><rect x="20" y="330" width="170" height="74" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="105.0" y="358.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">FM discriminator</text><text x="105.0" y="376.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">48 kS/s, 648 Hz = 1.0</text><rect x="220" y="44" width="1000" height="700" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="234.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">DMR Decoder (hier)</text><rect x="250" y="100" width="300" height="74" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="400.0" y="120.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">Matched filter</text><text x="400.0" y="138.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">stock FIR Filter, RRC α 0.2</text><text x="400.0" y="155.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">x = symbols at ±1 / ±3, 10 samples each</text><text x="250.0" y="88.0" font-size="11" fill="#888780" font-weight="600" text-anchor="start" dominant-baseline="central">STAGE 1 · stock</text><path d="M190 367 L215 367 L215 137 L250 137" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="250" y="216" width="300" height="108" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="400.0" y="244.5" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">Sync correlator bank</text><text x="400.0" y="262.5" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">4 × FIR: sync templates  → c</text><text x="400.0" y="279.5" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">2 × FIR: Σx, Σx²  → σ</text><text x="400.0" y="296.5" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">Divide: rho = c / σ  (−1 … +1)</text><text x="250.0" y="204.0" font-size="11" fill="#888780" font-weight="600" text-anchor="start" dominant-baseline="central">STAGE 1b · 16 stock blocks</text><path d="M400 174 L400 216" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="620" y="160" width="330" height="160" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="785.0" y="197.5" font-size="14" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">Burst framer</text><text x="785.0" y="215.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">sync peaks → sub-sample timing</text><text x="785.0" y="232.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">30 ms repeater grid (rejects false syncs)</text><text x="785.0" y="249.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">gain / DC fit from the sync</text><text x="785.0" y="266.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">cut bursts A…F and CACH points</text><text x="785.0" y="283.5" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">“progress” marks after each chunk</text><text x="620.0" y="148.0" font-size="11" fill="#888780" font-weight="600" text-anchor="start" dominant-baseline="central">STAGE 2 · EPB</text><path d="M550 270 L620 270" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="556.0" y="258.0" font-size="11" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">rho × 4</text><path d="M550 137 L585 137 L585 200 L620 200" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="592.0" y="165.0" font-size="11" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">x</text><rect x="620" y="400" width="330" height="140" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="785.0" y="444.5" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Layer 2 decoder</text><text x="785.0" y="462.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">CACH · slot type · BPTC · CRC / RS</text><text x="785.0" y="479.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">CSBK · voice LC · EMB · embedded LC</text><text x="785.0" y="496.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">channel picture + status panel</text><text x="620.0" y="388.0" font-size="11" fill="#888780" font-weight="600" text-anchor="start" dominant-baseline="central">STAGE 3 · EPB</text><path d="M700 320 L700 400" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="708.0" y="360.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">burst · cach · progress</text><rect x="620" y="610" width="330" height="110" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="785.0" y="639.5" font-size="14" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">AMBE+2 vocoder</text><text x="785.0" y="657.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">mbelib-neo via ctypes, 3 frames / burst</text><text x="785.0" y="674.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">audio placed on the signal timeline</text><text x="785.0" y="691.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">plays only up to the last progress mark</text><text x="620.0" y="598.0" font-size="11" fill="#888780" font-weight="600" text-anchor="start" dominant-baseline="central">STAGE 4 · EPB</text><path d="M700 540 L700 610" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="708.0" y="575.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">voice frames (216 soft bits)</text><path d="M870 610 L870 540" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="878.0" y="575.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">vstats</text><path d="M620 305 L595 305 L595 690 L620 690" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="587.0" y="500.0" font-size="11" fill="#3d3d3a" font-weight="600" text-anchor="end" dominant-baseline="central">8 kHz clock</text><rect x="1060" y="230" width="140" height="60" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="1130.0" y="251.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">sym</text><text x="1130.0" y="269.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">8 kHz → histogram</text><rect x="1060" y="440" width="140" height="60" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="1130.0" y="461.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">text</text><text x="1130.0" y="479.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">decoded lines (PDUs)</text><rect x="1060" y="635" width="140" height="60" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="1130.0" y="656.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">audio</text><text x="1130.0" y="674.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">8 kHz → sound card</text><path d="M950 260 L1060 260" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M950 470 L1060 470" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><path d="M950 690 L1060 690" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/></svg>