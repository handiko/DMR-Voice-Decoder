<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>Front end: from the dongle to symbol readings</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="300" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Steps ①–③ — tuning in, the discriminator and the matched filter (all stock blocks)</text><rect x="20" y="70" width="220" height="80" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="130.0" y="93.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">RTL-SDR Source</text><text x="130.0" y="111.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">tuned 100 kHz below</text><text x="130.0" y="128.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">960,000 samples/s</text><rect x="262" y="70" width="220" height="80" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="372.0" y="93.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">Freq Xlating FIR</text><text x="372.0" y="111.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">shift +100 kHz, rough filter</text><text x="372.0" y="128.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">÷4 → 240,000/s</text><path d="M240 110 L262 110" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="504" y="70" width="220" height="80" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="614.0" y="93.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">Low Pass Filter</text><text x="614.0" y="111.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">the channel filter</text><text x="614.0" y="128.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">÷5 → 48,000/s</text><path d="M482 110 L504 110" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="746" y="70" width="220" height="80" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="856.0" y="93.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">Quadrature Demod</text><text x="856.0" y="111.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">frequency reading</text><text x="856.0" y="128.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">648 Hz = 1.0</text><path d="M724 110 L746 110" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="988" y="70" width="220" height="80" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="1098.0" y="93.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">FIR Filter (RRC)</text><text x="1098.0" y="111.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">matched filter</text><text x="1098.0" y="128.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">inside the hier block</text><path d="M966 110 L988 110" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="20.0" y="185.0" font-size="12" fill="#3d3d3a" font-weight="700" text-anchor="start" dominant-baseline="central">Real-world equivalent:</text><text x="130.0" y="210.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">antenna, mixer, ADC</text><text x="372.0" y="210.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">1st IF + anti-alias filter</text><text x="614.0" y="210.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">IF crystal filter</text><text x="856.0" y="210.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">FM discriminator</text><text x="1098.0" y="210.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">receive half of the RRC pair</text><text x="20.0" y="250.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Why 960 kS/s? 960,000 = 4,800 × 200, so ÷4 ÷5 lands on exactly 10 samples per symbol — no fractional resampling anywhere.</text><text x="20.0" y="272.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Why 100 kHz below? RTL dongles have a spike of junk at exactly their tuned frequency; we keep the channel away from it.</text></svg>