<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>The sync fingerprint detector</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="600" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Step ④ — sliding a fingerprint along the signal</text><rect x="20" y="44" width="590" height="250" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">The idea</text><text x="40.0" y="78.0" font-size="12" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">Template (known sync, 24 symbols):</text><line x1="60.0" y1="120.0" x2="60.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="81.0" y1="120.0" x2="81.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="102.0" y1="120.0" x2="102.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="123.0" y1="120.0" x2="123.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="144.0" y1="120.0" x2="144.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="165.0" y1="120.0" x2="165.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="186.0" y1="120.0" x2="186.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="207.0" y1="120.0" x2="207.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="228.0" y1="120.0" x2="228.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="249.0" y1="120.0" x2="249.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="270.0" y1="120.0" x2="270.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="291.0" y1="120.0" x2="291.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="312.0" y1="120.0" x2="312.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="333.0" y1="120.0" x2="333.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="354.0" y1="120.0" x2="354.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="375.0" y1="120.0" x2="375.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="396.0" y1="120.0" x2="396.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="417.0" y1="120.0" x2="417.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="438.0" y1="120.0" x2="438.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="459.0" y1="120.0" x2="459.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="480.0" y1="120.0" x2="480.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="501.0" y1="120.0" x2="501.0" y2="147.0" stroke="#A32D2D" stroke-width="3"/><line x1="522.0" y1="120.0" x2="522.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><line x1="543.0" y1="120.0" x2="543.0" y2="93.0" stroke="#A32D2D" stroke-width="3"/><text x="40.0" y="160.0" font-size="12" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">Signal (what arrives — noisy, maybe weaker, maybe shifted):</text><line x1="60.0" y1="215.0" x2="60.0" y2="193.7" stroke="#185FA5" stroke-width="3"/><line x1="81.0" y1="215.0" x2="81.0" y2="218.8" stroke="#185FA5" stroke-width="3"/><line x1="102.0" y1="215.0" x2="102.0" y2="200.2" stroke="#185FA5" stroke-width="3"/><line x1="123.0" y1="215.0" x2="123.0" y2="188.0" stroke="#185FA5" stroke-width="3"/><line x1="144.0" y1="215.0" x2="144.0" y2="228.3" stroke="#185FA5" stroke-width="3"/><line x1="165.0" y1="215.0" x2="165.0" y2="195.9" stroke="#185FA5" stroke-width="3"/><line x1="186.0" y1="215.0" x2="186.0" y2="214.7" stroke="#185FA5" stroke-width="3"/><line x1="207.0" y1="215.0" x2="207.0" y2="225.7" stroke="#185FA5" stroke-width="3"/><line x1="228.0" y1="215.0" x2="228.0" y2="194.6" stroke="#185FA5" stroke-width="3"/><line x1="249.0" y1="215.0" x2="249.0" y2="189.7" stroke="#185FA5" stroke-width="3"/><line x1="270.0" y1="215.0" x2="270.0" y2="187.2" stroke="#185FA5" stroke-width="3"/><line x1="291.0" y1="215.0" x2="291.0" y2="226.9" stroke="#185FA5" stroke-width="3"/><line x1="312.0" y1="215.0" x2="312.0" y2="190.6" stroke="#185FA5" stroke-width="3"/><line x1="333.0" y1="215.0" x2="333.0" y2="232.8" stroke="#185FA5" stroke-width="3"/><line x1="354.0" y1="215.0" x2="354.0" y2="196.6" stroke="#185FA5" stroke-width="3"/><line x1="375.0" y1="215.0" x2="375.0" y2="197.1" stroke="#185FA5" stroke-width="3"/><line x1="396.0" y1="215.0" x2="396.0" y2="235.1" stroke="#185FA5" stroke-width="3"/><line x1="417.0" y1="215.0" x2="417.0" y2="236.2" stroke="#185FA5" stroke-width="3"/><line x1="438.0" y1="215.0" x2="438.0" y2="204.5" stroke="#185FA5" stroke-width="3"/><line x1="459.0" y1="215.0" x2="459.0" y2="195.8" stroke="#185FA5" stroke-width="3"/><line x1="480.0" y1="215.0" x2="480.0" y2="195.4" stroke="#185FA5" stroke-width="3"/><line x1="501.0" y1="215.0" x2="501.0" y2="228.7" stroke="#185FA5" stroke-width="3"/><line x1="522.0" y1="215.0" x2="522.0" y2="193.9" stroke="#185FA5" stroke-width="3"/><line x1="543.0" y1="215.0" x2="543.0" y2="202.7" stroke="#185FA5" stroke-width="3"/><text x="40.0" y="262.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Multiply pairwise, add up, divide by how much the signal varies → one score, rho.</text><text x="40.0" y="280.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Repeat at every one of the 48,000 samples per second.</text><rect x="630" y="44" width="590" height="250" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="644.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Why this score is useful</text><text x="650.0" y="85.0" font-size="13" fill="#0C447C" font-weight="700" text-anchor="start" dominant-baseline="central">Strength-blind</text><text x="650.0" y="105.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">divided by the signal’s own spread: one threshold</text><text x="650.0" y="123.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">works for strong and weak stations</text><text x="650.0" y="153.0" font-size="13" fill="#0C447C" font-weight="700" text-anchor="start" dominant-baseline="central">Offset-blind</text><text x="650.0" y="173.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">template averages to zero, so a constant shift</text><text x="650.0" y="191.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">(tuning error) adds nothing</text><text x="650.0" y="221.0" font-size="13" fill="#0C447C" font-weight="700" text-anchor="start" dominant-baseline="central">Two answers per template</text><text x="650.0" y="241.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">data sync = voice sync upside-down, so</text><text x="650.0" y="259.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">rho ≈ +1 voice, rho ≈ −1 data/control</text><rect x="20" y="310" width="1200" height="270" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="326.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">What rho looks like on a repeater carrying a call on slot 1 and control data on slot 2</text><line x1="60.0" y1="425.0" x2="1190.0" y2="425.0" stroke="#D3D1C7" stroke-width="1"/><line x1="60.0" y1="361.0" x2=