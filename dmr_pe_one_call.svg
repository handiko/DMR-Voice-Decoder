<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="350" viewBox="0 0 1240 350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>One voice call, start to finish</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="350" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">One call on slot 1, as the decoder sees it</text><rect x="30.0" y="70.0" width="144.0" height="80.0" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="102.0" y="92.0" font-size="13" fill="#501313" font-weight="700" text-anchor="middle" dominant-baseline="central">Voice LC header</text><text x="102.0" y="114.0" font-size="11" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">data sync, ×2–3</text><text x="102.0" y="132.0" font-size="11" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">TG, source, flags</text><rect x="180.0" y="70.0" width="224.0" height="80.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="292.0" y="92.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">Superframe 1</text><text x="292.0" y="114.0" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">A sync + B–F blind</text><text x="292.0" y="132.0" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">18 frames · 360 ms</text><rect x="410.0" y="70.0" width="224.0" height="80.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="522.0" y="92.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">Superframe 2</text><text x="522.0" y="114.0" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">A sync + B–F blind</text><text x="522.0" y="132.0" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">embedded LC repeats</text><rect x="640.0" y="70.0" width="114.0" height="80.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="697.0" y="92.0" font-size="13" fill="#5F5E5A" font-weight="700" text-anchor="middle" dominant-baseline="central">… more …</text><rect x="760.0" y="70.0" width="194.0" height="80.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="857.0" y="92.0" font-size="13" fill="#04342C" font-weight="700" text-anchor="middle" dominant-baseline="central">Superframe n</text><text x="857.0" y="114.0" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">last speech</text><rect x="960.0" y="70.0" width="144.0" height="80.0" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="1032.0" y="92.0" font-size="13" fill="#501313" font-weight="700" text-anchor="middle" dominant-baseline="central">Terminator</text><text x="1032.0" y="114.0" font-size="11" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">data sync</text><text x="1032.0" y="132.0" font-size="11" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">call ends</text><text x="30.0" y="195.0" font-size="13" fill="#3d3d3a" font-weight="700" text-anchor="start" dominant-baseline="central">Framer</text><text x="140.0" y="195.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">cuts bursts, keeps the 30 ms grid; after A, schedules B–F; looks for the next A at +360 ms</text><text x="30.0" y="235.0" font-size="13" fill="#3d3d3a" font-weight="700" text-anchor="start" dominant-baseline="central">Layer 2</text><text x="140.0" y="235.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">prints “CALL Group TG=… SRC=…” (from the header, or from embedded LC if you tuned in late); prints “END …” at the terminator</text><text x="30.0" y="275.0" font-size="13" fill="#3d3d3a" font-weight="700" text-anchor="start" dominant-baseline="central">Vocoder</text><text x="140.0" y="275.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">new call → fresh vocoder state; 3 frames per burst → 60 ms of audio; encrypted → muted</text><text x="30.0" y="315.0" font-size="13" fill="#3d3d3a" font-weight="700" text-anchor="start" dominant-baseline="central">You hear</text><text x="140.0" y="315.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">speech 0.4 s after it was on the air, with gaps only where bursts were really lost</text></svg>