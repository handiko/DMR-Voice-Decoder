<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>Layer 2: peeling off the protection layers</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="640" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Step ⑥ — Layer 2: peeling off the protection, layer by layer</text><rect x="20" y="44" width="600" height="576" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Data / control burst (sync rho ≈ −1)</text><rect x="45" y="70" width="550" height="72" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="320.0" y="97.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">144 symbols → 288 bits</text><text x="320.0" y="115.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">symbol levels → 2 bits each</text><rect x="45" y="162" width="550" height="72" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="320.0" y="181.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Slot type  (Golay 20,8)</text><text x="320.0" y="199.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">colour code + what kind of burst</text><text x="320.0" y="216.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">fixes up to 3 wrong bits of 20</text><path d="M320 142 L320 162" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="45" y="254" width="550" height="72" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="320.0" y="273.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Un-shuffle  (BPTC 196,96)</text><text x="320.0" y="291.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">bits were spread out over the burst</text><text x="320.0" y="308.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">row/column Hamming: fixes scattered errors</text><path d="M320 234 L320 254" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="45" y="346" width="550" height="72" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="320.0" y="365.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Checksum  (CRC with a type mask)</text><text x="320.0" y="383.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">96 → 80 bits of message + check</text><text x="320.0" y="400.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">wrong type or damaged → rejected</text><path d="M320 326 L320 346" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="45" y="438" width="550" height="72" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="320.0" y="457.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Read the fields</text><text x="320.0" y="475.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">CSBK: Aloha, broadcast, grant, …</text><text x="320.0" y="492.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">Voice LC: talkgroup, source ID</text><path d="M320 418 L320 438" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="45" y="530" width="550" height="72" rx="5" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="320.0" y="557.5" font-size="14" fill="#501313" font-weight="600" text-anchor="middle" dominant-baseline="central">Print a line / update the panel</text><text x="320.0" y="575.5" font-size="12" fill="#A32D2D" font-weight="400" text-anchor="middle" dominant-baseline="central">de-duplicated, colour-code filtered</text><path d="M320 510 L320 530" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="640" y="44" width="580" height="330" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="654.0" y="60.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Voice burst (sync rho ≈ +1, or blind B–F)</text><rect x="665" y="70" width="530" height="72" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="930.0" y="89.0" font-size="14" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">216 payload bits → 3 AMBE+2 frames</text><text x="930.0" y="107.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">each 72 bits = 20 ms of speech; un-shuffled with the</text><text x="930.0" y="124.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">standard interleave table, kept as soft bits</text><rect x="665" y="172" width="530" height="72" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="930.0" y="191.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Bursts B–E: 32-bit EMB field</text><text x="930.0" y="209.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">QR (16,7) check + 4 × 8 bits of “embedded LC”</text><text x="930.0" y="226.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">assembled over the superframe</text><rect x="665" y="274" width="530" height="80" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="930.0" y="297.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Embedded LC (Hamming 16,11 + 5-bit sum)</text><text x="930.0" y="315.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">talkgroup + source ID repeated every 360 ms</text><text x="930.0" y="332.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">→ you can join a call already in progress</text><path d="M930 142 L930 172" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M930 244 L930 274" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="640" y="390" width="580" height="230" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="654.0" y="406.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Every 30 ms: the CACH (12 symbols, 24 bits)</text><rect x="665" y="415" width="530" height="72" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="930.0" y="434.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">TACT  (Hamming 7,4)</text><text x="930.0" y="452.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">which slot comes next, is the channel busy,</text><text x="930.0" y="469.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">where a Short LC starts and ends</text><rect x="665" y="517" width="530" height="80" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="930.0" y="540.0" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Short LC  (4 pieces · Hamming 17,12 · CRC-8)</text><text x="930.0" y="558.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">every 120 ms on a repeater: site ID,</text><text x="930.0" y="575.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">activity flags for both slots</text><path d="M930 487 L930 517" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/></svg>