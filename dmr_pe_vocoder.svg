<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>Vocoder: audio on the signal timeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="470" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">Step ⑦ — placing speech on a timeline, and only playing what is finished</text><line x1="60.0" y1="120.0" x2="1180.0" y2="120.0" stroke="#3d3d3a" stroke-width="1.4"/><text x="60.0" y="90.0" font-size="12" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">Signal time (sample position in the 48 kS/s stream)</text><rect x="120.0" y="106.0" width="80.0" height="28.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="160.0" y="120.0" font-size="11" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">burst</text><rect x="240.0" y="106.0" width="80.0" height="28.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="280.0" y="120.0" font-size="11" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">burst</text><rect x="360.0" y="106.0" width="80.0" height="28.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="400.0" y="120.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">lost</text><rect x="480.0" y="106.0" width="80.0" height="28.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="520.0" y="120.0" font-size="11" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">burst</text><rect x="600.0" y="106.0" width="80.0" height="28.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="640.0" y="120.0" font-size="11" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">in transit</text><line x1="60.0" y1="260.0" x2="1180.0" y2="260.0" stroke="#3d3d3a" stroke-width="1.4"/><text x="60.0" y="290.0" font-size="12" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">Audio timeline (8 kHz output buffer) = signal time + audio delay (0.4 s)</text><rect x="460.0" y="246.0" width="120.0" height="28.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="520.0" y="260.0" font-size="10" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">60 ms speech</text><path d="M160 134 L500 246" fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="580.0" y="246.0" width="120.0" height="28.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="640.0" y="260.0" font-size="10" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">60 ms speech</text><path d="M280 134 L620 246" fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="700.0" y="246.0" width="120.0" height="28.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="760.0" y="260.0" font-size="10" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">silence (60 ms)</text><rect x="820.0" y="246.0" width="120.0" height="28.0" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="880.0" y="260.0" font-size="10" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">60 ms speech</text><path d="M520 134 L860 246" fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="940.0" y="246.0" width="120.0" height="28.0" rx="3" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="1000.0" y="260.0" font-size="10" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">not written yet</text><line x1="560.0" y1="70.0" x2="560.0" y2="140.0" stroke="#A32D2D" stroke-width="2"/><text x="566.0" y="75.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">last “progress” mark</text><line x1="900.0" y1="220.0" x2="900.0" y2="320.0" stroke="#A32D2D" stroke-width="2"/><text x="906.0" y="310.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">release point</text><path d="M560 140 L900 220" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="60.0" y="320.0" font-size="12" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">◄ may be played</text><text x="890.0" y="330.0" font-size="12" fill="#A32D2D" font-weight="700" text-anchor="end" dominant-baseline="central">must wait ►</text><text x="30.0" y="370.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Each voice burst carries 60 ms of speech. It is written into the buffer at its own place in signal time (plus a fixed 0.4 s delay),</text><text x="30.0" y="390.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">so pauses stay pauses and a lost burst becomes 60 ms of silence instead of shifting everything after it.</text><text x="30.0" y="418.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">The block hands audio to the sound card only up to the release point: beyond it, a burst may still be on its way through Layer 2</text><text x="30.0" y="438.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">(the stages run in separate threads). Without this rule, a fast input such as a recording made the vocoder run ahead and play silence.</text></svg>