<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>From antenna to text and audio: the whole receiver</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3d3d3a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1240" height="470" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="15" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">The whole receiver — what happens, in order</text><path d="M760 22 L800 22" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="808.0" y="22.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">stream (every sample)</text><path d="M970 22 L1010 22" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="1018.0" y="22.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">message (once per burst / event)</text><rect x="20" y="50" width="400" height="400" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="66.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">dmr_rx_hier.grc — the receiver (stock blocks)</text><rect x="45" y="85" width="350" height="62" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="220.0" y="107.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">① Tune in</text><text x="220.0" y="125.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">RTL-SDR + shift + two filters → one 12.5 kHz channel</text><rect x="45" y="185" width="350" height="62" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="220.0" y="207.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">② FM discriminator</text><text x="220.0" y="225.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">radio wave → frequency reading, 48,000 per second</text><path d="M220 147 L220 185" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="45" y="285" width="350" height="62" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="220.0" y="307.5" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">Screens</text><text x="220.0" y="325.5" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">spectrum · symbol histogram · console</text><rect x="45" y="375" width="350" height="55" rx="5" fill="#F4F4F2" stroke="#B4B2A9" stroke-width="1"/><text x="220.0" y="394.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle" dominant-baseline="central">Sound card</text><text x="220.0" y="412.0" font-size="12" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">8 kHz → ×6 → 48 kHz</text><rect x="450" y="50" width="770" height="400" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="464.0" y="66.0" font-size="13" fill="#2C2C2A" font-weight="700" text-anchor="start" dominant-baseline="central">DMR Decoder — the hier block (dmr_decoder_hier.grc)</text><rect x="475" y="85" width="330" height="62" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="640.0" y="107.5" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">③ Matched filter</text><text x="640.0" y="125.5" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">sharpens each symbol, removes noise</text><rect x="475" y="185" width="330" height="80" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="640.0" y="208.0" font-size="14" fill="#0C447C" font-weight="600" text-anchor="middle" dominant-baseline="central">④ Fingerprint detector</text><text x="640.0" y="226.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">4 sync patterns slid along the signal</text><text x="640.0" y="243.0" font-size="12" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">score rho: +1 voice / −1 data</text><rect x="860" y="85" width="335" height="180" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="1027.5" y="124.0" font-size="14" fill="#412402" font-weight="600" text-anchor="middle" dominant-baseline="central">⑤ Burst framer</text><text x="1027.5" y="142.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">picks the real sync peaks</text><text x="1027.5" y="159.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">checks the 30 ms rhythm</text><text x="1027.5" y="176.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">measures level, offset, timing</text><text x="1027.5" y="193.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">cuts out each burst (144 symbols)</text><text x="1027.5" y="210.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">cuts sync-less voice bursts B–F</text><text x="1027.5" y="227.0" font-size="12" fill="#854F0B" font-weight="400" text-anchor="middle" dominant-baseline="central">says “all bursts up to here sent”</text><rect x="860" y="300" width="335" height="62" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="1027.5" y="322.5" font-size="14" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">⑥ Layer 2 decoder</text><text x="1027.5" y="340.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">error correction → who, where, what</text><rect x="475" y="300" width="330" height="62" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="640.0" y="322.5" font-size="14" fill="#04342C" font-weight="600" text-anchor="middle" dominant-baseline="central">⑦ Vocoder</text><text x="640.0" y="340.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">AMBE+2 bits → speech, on a timeline</text><path d="M395 216 L425 216 L425 116 L475 116" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M640 147 L640 185" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M805 225 L860 225" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="810.0" y="212.0" font-size="11" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">rho ×4 + x</text><path d="M1027 265 L1027 300" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="1035.0" y="282.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">bursts</text><path d="M860 331 L805 331" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="815.0" y="318.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">voice</text><path d="M900 265 L900 280 L700 280 L700 300" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="860.0" y="290.0" font-size="11" fill="#3d3d3a" font-weight="600" text-anchor="end" dominant-baseline="central">symbols, 8 kHz (clock)</text><path d="M700 280 L430 280 L430 305 L395 305" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="470.0" y="290.0" font-size="11" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">→ histogram</text><path d="M1195 331 L1210 331 L1210 440 L420 440 L420 335 L395 335" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahm)"/><text x="800.0" y="430.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="middle" dominant-baseline="central">text lines → console</text><path d="M475 345 L440 345 L440 402 L395 402" fill="none" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#ah)"/><text x="448.0" y="385.0" font-size="11" fill="#3d3d3a" font-weight="600" text-anchor="start" dominant-baseline="central">audio</text></svg>